# FitMate — конфигурация Render (Blueprint)
# Деплоит одним нажатием: API + веб-панель тренера + Mini App
# Render: New -> Blueprint -> ваш репозиторий

services:
  # --- Бэкенд API ---
  - type: web
    name: fitmate-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build --workspace @fitmate/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOT_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PLAN_REMINDER_HOUR
        value: "6"
      - key: NUTRITION_REMINDER_HOUR
        value: "18"

  # --- Веб-панель тренера ---
  - type: web
    name: fitmate-web
    runtime: static
    buildCommand: npm install && npm run build --workspace @fitmate/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://fitmate-api-6ako.onrender.com/api/trainer

  # --- Telegram Mini App (клиент) ---
  - type: web
    name: fitmate-miniapp
    runtime: static
    buildCommand: npm install && npm run build --workspace @fitmate/miniapp
    staticPublishPath: ./apps/miniapp/dist
    envVars:
      - key: VITE_API_URL
        value: https://fitmate-api-6ako.onrender.com/api/bot

  # --- Telegram бот (webhook) ---
  - type: web
    name: fitmate-bot
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build --workspace @fitmate/bot
    startCommand: node apps/bot/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: BOT_TOKEN
        sync: false
      - key: BOT_API_KEY
        sync: false
      - key: BOT_API_URL
        value: https://fitmate-api-6ako.onrender.com/api/bot
      - key: MINIAPP_URL
        value: https://fitmate-miniapp.onrender.com