# FitMate — конфигурация Render (Blueprint)
# Деплоит одним нажатием: API + веб-панель тренера + Mini App
# Render: New -> Blueprint -> ваш репозиторий

services:
  # --- Бэкенд API ---
  - type: web
    name: fitmate-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build --workspace @fitmate/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOT_API_KEY
        sync: false

  # --- Веб-панель тренера ---
  - type: static
    name: fitmate-web
    rootDir: .
    buildCommand: npm install && npm run build --workspace @fitmate/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://fitmate-api.onrender.com/api/trainer

  # --- Telegram Mini App (клиент) ---
  - type: static
    name: fitmate-miniapp
    rootDir: .
    buildCommand: npm install && npm run build --workspace @fitmate/miniapp
    staticPublishPath: ./apps/miniapp/dist
    envVars:
      - key: VITE_API_URL
        value: https://fitmate-api.onrender.com/api/bot
